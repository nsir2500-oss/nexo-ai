/* CHAT */

function enterKey(e){

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();
sendMessage();

}

}


async function sendMessage(){

const input=document.getElementById("message");
const messages=document.getElementById("messages");

if(!input||!input.value.trim())return;

const message=input.value.trim();

messages.innerHTML+=`

<div class="msg user">
${escapeHTML(message)}
</div>`;

input.value="";

const loading=document.createElement("div");

loading.className="msg ai";
loading.textContent="NEXO is thinking...";

messages.appendChild(loading);

try{

const response=await fetch(BACKEND,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

});

const data=await response.json();

if(!response.ok){

loading.textContent=
"AI temporarily unavailable. Website Builder is available.";

return;

}

loading.textContent=
data.reply||"NEXO received an empty response.";

historyData.push({
message:message,
reply:data.reply||""
});

localStorage.setItem(
"nexo_history",
JSON.stringify(historyData)
);

}catch(error){

loading.textContent="AI connection unavailable.";

}

messages.scrollTop=messages.scrollHeight;

}

input.value=text;

}

/* GENERATE WEBSITE */

function generateWebsite(){

const input=document.getElementById("builderPrompt");
const codeArea=document.getElementById("codeArea");

if(!input||!input.value.trim()){

alert("First describe the website you want.");
return;

}

const originalPrompt=input.value.trim();
const prompt=originalPrompt.toLowerCase();

let type="business";

/* TYPE DETECTION */

if(
prompt.includes("restaurant")||
prompt.includes("food")||
prompt.includes("cafe")||
prompt.includes("hotel")||
prompt.includes("dining")
){

type="restaurant";

}

else if(
prompt.includes("portfolio")||
prompt.includes("video editor")||
prompt.includes("designer")||
prompt.includes("photographer")
){

type="portfolio";

}

else if(
prompt.includes("shopping")||
prompt.includes("shop")||
prompt.includes("store")||
prompt.includes("ecommerce")||
prompt.includes("e-commerce")
){

type="shopping";

}


/* NAME DETECTION */

let websiteName="";

const patterns=[

/called\s+["']([^"']+)["']/i,

/named\s+["']([^"']+)["']/i,

/name\s+(?:is|to|as)\s+["']([^"']+)["']/i

];

for(const pattern of patterns){

const match=originalPrompt.match(pattern);

if(match){

websiteName=match[1].trim();

break;

}

}

/* FALLBACK NAME */

if(!websiteName){

if(type==="restaurant")
websiteName="Royal Taste";

else if(type==="portfolio")
websiteName="Creative Vision";

else if(type==="shopping")
websiteName="TrendCart";

else
websiteName="Nova Business";

}

const website=createWebsite(
type,
websiteName,
originalPrompt
);

currentWebsite=website;

codeArea.value=website;

refreshPreview();

localStorage.setItem(
"nexo_website",
website
);

}

/* EDIT WEBSITE */

function editWebsite(){

const codeArea=document.getElementById("codeArea");
const promptBox=document.getElementById("editPrompt");
const status=document.getElementById("editStatus");

if(!codeArea||!codeArea.value.trim()){

alert("First generate a website.");
return;

}

if(!promptBox||!promptBox.value.trim()){

alert("Tell NEXO what you want to change.");
return;

}

let code=codeArea.value;
const prompt=promptBox.value.toLowerCase();

status.textContent="Applying your changes...";


/* WEBSITE NAME */

const namePatterns=[

/website name\s+(?:to|as)\s+["']([^"']+)["']/i,

/site name\s+(?:to|as)\s+["']([^"']+)["']/i,

/change (?:the )?(?:website )?name\s+(?:to|as)\s+["']([^"']+)["']/i,

/rename\s+(?:the )?(?:website )?(?:to|as)\s+["']([^"']+)["']/i

];

let newName="";

for(const pattern of namePatterns){

const match=promptBox.value.match(pattern);

if(match){

newName=match[1].trim();
break;

}

}

if(newName){

code=code.replace(
/<title>.*?<\/title>/i,
"<title>"+escapeHTML(newName)+"</title>"
);

code=code.replace(
/<div class="logo">[\s\S]*?<\/div>/i,
'<div class="logo">'+escapeHTML(newName)+'</div>'
);

code=code.replace(
/<h1>[\s\S]*?<\/h1>/i,
"<h1>"+escapeHTML(newName)+"</h1>"
);

code=code.replace(
/Welcome to .*?\./i,
"Welcome to "+escapeHTML(newName)+"."
);

}


/* BACKGROUND */

if(
prompt.includes("black background")||
prompt.includes("background black")||
prompt.includes("dark background")
){

code=code.replace(
"background:#f5f5f5",
"background:#0b0b0b"
);

code=code.replace(
"color:#171717",
"color:#ffffff"
);

}


/* RED BUTTON */

if(
prompt.includes("red button")||
prompt.includes("button red")
){

code=code.replace(
"background:white;\ncolor:#111",
"background:#ef4444;\ncolor:white"
);

}


/* BLUE BUTTON */

if(
prompt.includes("blue button")||
prompt.includes("button blue")
){

code=code.replace(
"background:white;\ncolor:#111",
"background:#2563eb;\ncolor:white"
);

}


/* BLACK FOOTER */

if(
prompt.includes("black footer")||
prompt.includes("footer black")
){

code=code.replace(
"background:#111827",
"background:#000000"
);

}


/* ADD REVIEWS */

if(
prompt.includes("review")||
prompt.includes("reviews")
){

if(!code.includes('id="reviews"')){

const reviews=`

<section class="section" id="reviews">

<h2>Customer Reviews</h2>

<div class="cards">

<div class="card">
<h3>⭐⭐⭐⭐⭐</h3>
<p>"Amazing experience and excellent quality."</p>
<strong>— Rahul</strong>
</div>

<div class="card">
<h3>⭐⭐⭐⭐⭐</h3>
<p>"Professional, clean and exactly what I needed."</p>
<strong>— Priya</strong>
</div>

<div class="card">
<h3>⭐⭐⭐⭐⭐</h3>
<p>"Great service and a beautiful experience."</p>
<strong>— Aman</strong>
</div>

</div>

</section>
`;

code=code.replace(
'<section class="section contact"',
reviews+'<section class="section contact"'
);

}

}


/* ADD MENU */

if(
prompt.includes("add menu")||
prompt.includes("menu section")
){

if(!code.includes('id="menu-extra"')){

const menu=`

<section class="section" id="menu-extra">

<h2>Special Menu</h2>

<div class="cards">

<div class="card">
<h3>🍔 Classic Burger</h3>
<p>Fresh and delicious.</p>
<strong>₹199</strong>
</div>

<div class="card">
<h3>🍕 Special Pizza</h3>
<p>Hot and cheesy.</p>
<strong>₹299</strong>
</div>

<div class="card">
<h3>🍝 Pasta</h3>
<p>Creamy and tasty.</p>
<strong>₹229</strong>
</div>

</div>

</section>
`;

code=code.replace(
'<section class="section contact"',
menu+'<section class="section contact"'
);

}

}


/* SAVE */

codeArea.value=code;

currentWebsite=code;

localStorage.setItem(
"nexo_website",
code
);

refreshPreview();

status.textContent="Changes applied successfully! ✨";

promptBox.value="";

}


/* PREVIEW */

function refreshPreview(){

const codeArea=document.getElementById("codeArea");
const preview=document.getElementById("websitePreview");

if(!codeArea||!preview)return;

currentWebsite=codeArea.value;

preview.srcdoc=currentWebsite;

}


/* MOBILE PREVIEW */

function toggleMobilePreview(){

const preview=document.getElementById("websitePreview");

if(!preview)return;

preview.classList.toggle("mobile-preview");

}


/* COPY */

function copyWebsiteCode(){

const codeArea=document.getElementById("codeArea");

if(!codeArea||!codeArea.value){

alert("Generate a website first.");
return;

}

navigator.clipboard.writeText(codeArea.value)
.then(()=>{

alert("Website code copied! 📋");

})
.catch(()=>{

codeArea.select();

document.execCommand("copy");

alert("Website code copied! 📋");

});

}


/* CLEAR */

function clearBuilder(){

const input=document.getElementById("builderPrompt");
const edit=document.getElementById("editPrompt");
const code=document.getElementById("codeArea");
const preview=document.getElementById("websitePreview");

if(input)input.value="";
if(edit)edit.value="";
if(code)code.value="";
if(preview)preview.srcdoc="";

currentWebsite="";

localStorage.removeItem("nexo_website");

}


/* LOAD */

function loadSavedWebsite(){

const saved=localStorage.getItem("nexo_website");

const code=document.getElementById("codeArea");

if(saved&&code){

code.value=saved;

currentWebsite=saved;

refreshPreview();

}

}


/* ESCAPE */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


show("home");

</script>
