/* CHAT */

function enterKey(e){

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();
sendMessage();

}

}


async function sendMessage(){

const input=document.getElementById("message");
const messages=document.getElementById("messages");

if(!input||!input.value.trim())return;

const message=input.value.trim();

messages.innerHTML+=`

<div class="msg user">
${escapeHTML(message)}
</div>`;

input.value="";

const loading=document.createElement("div");

loading.className="msg ai";
loading.textContent="NEXO is thinking...";

messages.appendChild(loading);


try{

const response=await fetch(BACKEND,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

});

const data=await response.json();

if(!response.ok){

loading.textContent=
"AI temporarily unavailable. Website Builder can still be used.";

return;

}

loading.textContent=
data.reply||"NEXO received an empty response.";

historyData.push({
message:message,
reply:data.reply||""
});

localStorage.setItem(
"nexo_history",
JSON.stringify(historyData)
);

}catch(error){

loading.textContent="AI connection unavailable.";

}

messages.scrollTop=messages.scrollHeight;

}

function useExample(text){

input.value=text;

function generateWebsite(){

const input=document.getElementById("builderPrompt");
const codeArea=document.getElementById("codeArea");

if(!input||!input.value.trim()){
alert("First describe the website you want.");
return;
}

const originalPrompt=input.value.trim();
const prompt=originalPrompt.toLowerCase();

let type="business";

/* WEBSITE TYPE */

if(
prompt.includes("restaurant")||
prompt.includes("food")||
prompt.includes("cafe")||
prompt.includes("hotel")||
prompt.includes("dining")
){
type="restaurant";
}

else if(
prompt.includes("portfolio")||
prompt.includes("video editor")||
prompt.includes("designer")||
prompt.includes("photographer")
){
type="portfolio";
}

else if(
prompt.includes("shopping")||
prompt.includes("shop")||
prompt.includes("ecommerce")||
prompt.includes("e-commerce")||
prompt.includes("store")
){
type="shopping";
}

/* WEBSITE NAME */

let websiteName="NEXO Business";

const namePatterns=[
/called\s+["']([^"']+)["']/i,
/named\s+["']([^"']+)["']/i,
/name\s+(?:is|to|as)\s+["']([^"']+)["']/i,
/(?:called|named)\s+([A-Za-z0-9][A-Za-z0-9 &'-]{2,40})/i
];

for(const pattern of namePatterns){

const match=originalPrompt.match(pattern);

if(match){

websiteName=match[1].trim();

break;

}

}

/* DEFAULT NAMES */

if(type==="restaurant" && websiteName==="NEXO Business"){
websiteName="Royal Taste Restaurant";
}

if(type==="portfolio" && websiteName==="NEXO Business"){
websiteName="Creative Studio";
}

if(type==="shopping" && websiteName==="NEXO Business"){
websiteName="NEXO Store";
}

/* GENERATE */

const website=createWebsite(type,websiteName);

currentWebsite=website;

codeArea.value=website;

refreshPreview();

localStorage.setItem("nexo_website",website);

}

/* EDIT WEBSITE */

function editWebsite(){

const codeArea=document.getElementById("codeArea");
const promptBox=document.getElementById("editPrompt");
const status=document.getElementById("editStatus");

if(!codeArea||!codeArea.value.trim()){

alert("First generate a website.");

return;

}

if(!promptBox||!promptBox.value.trim()){

alert("Tell NEXO what you want to change.");

return;

}

let code=codeArea.value;
const prompt=promptBox.value.toLowerCase();

status.textContent="Applying your changes...";


/* BACKGROUND */

if(
prompt.includes("black background")||
prompt.includes("background black")||
prompt.includes("dark background")
){

code=code.replace(
"background:#f5f5f5",
"background:#0b0b0b"
);

code=code.replace(
"color:#171717",
"color:#ffffff"
);

}


/* WHITE BACKGROUND */

if(
prompt.includes("white background")||
prompt.includes("background white")
){

code=code.replace(
"background:#f5f5f5",
"background:#ffffff"
);

}


/* RED BUTTON */

if(
prompt.includes("red button")||
prompt.includes("button red")||
prompt.includes("contact button red")
){

code=code.replace(
"background:white;\ncolor:#111",
"background:#ef4444;\ncolor:white"
);

}


/* BLUE BUTTON */

if(
prompt.includes("blue button")||
prompt.includes("button blue")
){

code=code.replace(
"background:white;\ncolor:#111",
"background:#2563eb;\ncolor:white"
);

}


/* CHANGE TITLE */

const titleMatch=
prompt.match(
/(?:website name|site name|title|name)\s+(?:to|as)\s+["']?([^"']+)["']?/
);

if(titleMatch){

const newTitle=titleMatch[1]
.trim()
.replace(/[.]+$/,"");

code=code.replace(
/<title>.*?<\/title>/,
"<title>"+newTitle+"</title>"
);

code=code.replace(
/<div class="logo">.*?<\/div>/,
'<div class="logo">'+newTitle+'</div>'
);

code=code.replace(
/<h1>.*?<\/h1>/,
"<h1>"+newTitle+"</h1>"
);

}


/* ADD MENU SECTION */

if(
prompt.includes("add menu")||
prompt.includes("menu section")||
prompt.includes("add a menu")
){

if(!code.includes('id="menu"')){

const menu=`

<section class="section" id="menu">

<h2>Our Menu</h2>

<div class="cards">

<div class="card">
<h3>🍔 Classic Burger</h3>
<p>Fresh ingredients and delicious taste.</p>
</div>

<div class="card">
<h3>🍕 Special Pizza</h3>
<p>Hot, fresh and made with quality ingredients.</p>
</div>

<div class="card">
<h3>🥗 Fresh Salad</h3>
<p>Healthy, fresh and full of flavour.</p>
</div>

</div>

</section>
`;

code=code.replace(
'<section class="section contact"',
menu+'<section class="section contact"'
);

code=code.replace(
'<a href="#contact">Contact</a>',
'<a href="#menu">Menu</a><a href="#contact">Contact</a>'
);

}

}


/* ADD SERVICES */

if(
prompt.includes("add services")||
prompt.includes("services section")
){

if(!code.includes('id="services"')){

const services=`

<section class="section" id="services">

<h2>Our Services</h2>

<div class="cards">

<div class="card">
<h3>🚀 Fast Service</h3>
<p>Quick and reliable service for every customer.</p>
</div>

<div class="card">
<h3>⭐ Premium Quality</h3>
<p>Professional quality and attention to detail.</p>
</div>

<div class="card">
<h3>💡 Custom Solutions</h3>
<p>Solutions designed around your needs.</p>
</div>

</div>

</section>
`;

code=code.replace(
'<section class="section contact"',
services+'<section class="section contact"'
);

}

}


/* ADD ABOUT */

if(
prompt.includes("add about")||
prompt.includes("about section")
){

if(!code.includes('id="about-extra"')){

const about=`

<section class="section" id="about-extra">

<h2>About Us</h2>

<p style="max-width:800px;margin:auto;text-align:center;line-height:1.7;color:#666">
We are passionate about creating quality experiences for our customers.
Our goal is to combine great design, quality and simplicity.
</p>

</section>
`;

code=code.replace(
'<section class="section contact"',
about+'<section class="section contact"'
);

}

}


/* FOOTER */

if(
prompt.includes("footer black")||
prompt.includes("black footer")
){

code=code.replace(
"background:#111827",
"background:#000000"
);

}


/* SAVE + PREVIEW */

codeArea.value=code;

currentWebsite=code;

localStorage.setItem(
"nexo_website",
code
);

refreshPreview();

status.textContent="Changes applied successfully! ✨";

promptBox.value="";

}


/* PREVIEW */

function refreshPreview(){

const codeArea=document.getElementById("codeArea");
const preview=document.getElementById("websitePreview");

if(!codeArea||!preview)return;

currentWebsite=codeArea.value;

preview.srcdoc=currentWebsite;

}


function toggleMobilePreview(){

const preview=document.getElementById("websitePreview");

if(!preview)return;

preview.classList.toggle("mobile-preview");

}


function copyWebsiteCode(){

const codeArea=document.getElementById("codeArea");

if(!codeArea||!codeArea.value){

alert("Generate a website first.");

return;

}

navigator.clipboard
.writeText(codeArea.value)
.then(()=>{

alert("Website code copied! 📋");

})
.catch(()=>{

codeArea.select();

document.execCommand("copy");

alert("Website code copied! 📋");

});

}


function clearBuilder(){

const input=document.getElementById("builderPrompt");
const edit=document.getElementById("editPrompt");
const code=document.getElementById("codeArea");
const preview=document.getElementById("websitePreview");

if(input)input.value="";
if(edit)edit.value="";
if(code)code.value="";
if(preview)preview.srcdoc="";

localStorage.removeItem("nexo_website");

}


function loadSavedWebsite(){

const saved=localStorage.getItem("nexo_website");

const code=document.getElementById("codeArea");

if(saved&&code){

code.value=saved;
currentWebsite=saved;
refreshPreview();

}

}


function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


show("home");

</script>
