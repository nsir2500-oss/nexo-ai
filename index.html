<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO — Your AI for Everything</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0d12;
  color:#fff;
  height:100vh;
  overflow:hidden
}
.app{display:flex;height:100vh}

.sidebar{
  width:250px;
  background:#11141b;
  border-right:1px solid #252936;
  padding:18px 12px;
  display:flex;
  flex-direction:column
}
.logo{
  font-size:27px;
  font-weight:800;
  padding:10px 14px 25px;
  letter-spacing:2px
}
.newchat{
  background:#fff;
  color:#111;
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px
}
.nav button{
  width:100%;
  background:none;
  color:#c9ccd5;
  border:0;
  text-align:left;
  padding:12px 14px;
  border-radius:9px;
  margin:2px 0;
  cursor:pointer;
  font-size:15px
}
.nav button:hover{background:#1d212b;color:#fff}
.bottom{margin-top:auto}

.main{flex:1;display:flex;flex-direction:column}
.topbar{
  height:62px;
  border-bottom:1px solid #252936;
  display:flex;
  align-items:center;
  padding:0 22px;
  font-weight:bold
}
.topbar span{color:#888;margin-left:8px;font-weight:normal}

.content{
  flex:1;
  overflow:auto;
  padding:30px
}
.hero{
  max-width:900px;
  margin:35px auto;
  text-align:center
}
.hero h1{
  font-size:48px;
  margin-bottom:12px
}
.hero p{color:#9da2ae;font-size:18px}

.grid{
  max-width:950px;
  margin:35px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px
}
.card{
  background:#151821;
  border:1px solid #292d38;
  border-radius:15px;
  padding:22px;
  cursor:pointer;
  transition:.2s
}
.card:hover{
  transform:translateY(-2px);
  border-color:#555
}
.card h3{margin-bottom:8px}
.card p{color:#9297a4;font-size:14px;line-height:1.5}

.chat{
  max-width:900px;
  margin:auto;
  height:100%;
  display:flex;
  flex-direction:column
}
.messages{
  flex:1;
  overflow:auto;
  padding:20px 0
}
.msg{
  padding:14px 18px;
  margin:10px 0;
  border-radius:14px;
  max-width:80%;
  line-height:1.5;
  white-space:pre-wrap
}
.user{background:#242936;margin-left:auto}
.ai{background:#151821;border:1px solid #292d38}

.inputbox{
  border:1px solid #303541;
  background:#151821;
  border-radius:16px;
  padding:10px;
  display:flex;
  gap:8px;
  margin-bottom:20px
}
.inputbox textarea{
  flex:1;
  background:none;
  color:white;
  border:0;
  outline:0;
  resize:none;
  padding:10px;
  font-size:15px;
  min-height:45px
}
.inputbox button{
  width:45px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  cursor:pointer;
  font-size:18px
}

.page{max-width:1000px;margin:auto}
.page h2{font-size:30px;margin-bottom:10px}
.page>p{color:#999;margin-bottom:25px}

@media(max-width:700px){
  .sidebar{width:70px;padding:10px 7px}
  .logo{font-size:18px;padding:10px 5px 20px}
  .newchat{font-size:0}
  .newchat:after{content:"+";font-size:22px}
  .nav button{font-size:0;text-align:center}
  .nav button:before{content:"•";font-size:20px}
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:36px}
  .content{padding:18px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">NEXO</div>

  <button class="newchat" onclick="show('chat')">＋ New Chat</button>

  <div class="nav">
    <button onclick="show('home')">⌂ Home</button>
    <button onclick="show('chat')">◉ Chat</button>
    <button onclick="show('history')">◷ History</button>
    <button onclick="show('projects')">▣ Projects</button>
    <button onclick="show('builder')">⌘ Website Builder</button>
    <button onclick="show('files')">▤ Files</button>
    <button onclick="show('settings')">⚙ Settings</button>
  </div>

  <div class="bottom nav">
    <button onclick="alert('NEXO account system coming soon')">♙ Account</button>
  </div>
</aside>

<main class="main">

  <div class="topbar">
    NEXO <span>Your AI for everything</span>
  </div>

  <div class="content" id="content"></div>

</main>
</div>

<script>

const BACKEND="https://ksiei-ai-backend.onrender.com/chat";

let historyData=JSON.parse(localStorage.getItem("nexo_history")||"[]");

function show(screen){

const c=document.getElementById("content");

if(screen==="home"){
c.innerHTML=`
<div class="hero">
<h1>What can I help you build?</h1>
<p>Chat, code, create websites, manage projects and more.</p>
</div>

<div class="grid">
<div class="card" onclick="show('chat')">
<h3>💬 AI Chat</h3>
<p>Ask questions, brainstorm ideas and get AI assistance.</p>
</div>

<div class="card" onclick="show('builder')">
<h3>🌐 Website Builder</h3>
<p>Tell NEXO what website you want and start building it.</p>
</div>

<div class="card" onclick="show('projects')">
<h3>🚀 Projects</h3>
<p>Create and manage your AI projects.</p>
</div>

<div class="card" onclick="show('files')">
<h3>📁 Files</h3>
<p>Work with your project files.</p>
</div>

<div class="card" onclick="show('history')">
<h3>🕘 History</h3>
<p>View your previous NEXO conversations.</p>
</div>

<div class="card" onclick="show('settings')">
<h3>⚙ Settings</h3>
<p>Manage your NEXO settings.</p>
</div>
</div>`;
return;
}

if(screen==="chat"){
c.innerHTML=`
<div class="chat">
<div class="messages" id="messages">
<div class="msg ai">Hello! I'm NEXO. 👋<br><br>Tell me what you want to do.</div>
</div>

<div class="inputbox">
<textarea id="message" placeholder="Message NEXO..." onkeydown="enterKey(event)"></textarea>
<button onclick="sendMessage()">➤</button>
</div>
</div>`;
return;
}

if(screen==="builder"){
c.innerHTML=`
<div class="page">
<h2>🌐 Website Builder</h2>
<p>Describe the website you want NEXO to build.</p>

<div class="card">
<h3>Example</h3>
<p style="margin:12px 0">
“Make me a modern shopping website with products, cart, login and seller panel.”
</p>
<button class="newchat" onclick="startBuilder()">Start Building</button>
</div>
</div>`;
return;
}

if(screen==="projects"){
c.innerHTML=`
<div class="page">
<h2>🚀 Projects</h2>
<p>Your NEXO projects will appear here.</p>
<div class="grid">
<div class="card">
<h3>＋ New Project</h3>
<p>Create a new AI project.</p>
</div>
</div>
</div>`;
return;
}

if(screen==="history"){
let html=historyData.length
? historyData.map(x=>`<div class="card"><h3>${escapeHTML(x.message)}</h3><p>${escapeHTML(x.reply)}</p></div>`).join("")
: `<div class="card"><h3>No conversations yet</h3><p>Start chatting with NEXO.</p></div>`;

c.innerHTML=`
<div class="page">
<h2>🕘 Chat History</h2>
<p>Your previous NEXO conversations.</p>
<div class="grid">${html}</div>
</div>`;
return;
}

if(screen==="files"){
c.innerHTML=`
<div class="page">
<h2>📁 Files</h2>
<p>Project files and uploads will appear here.</p>
<div class="card">
<h3>Upload File</h3>
<p>File management system will be connected here.</p>
<br>
<input type="file">
</div>
</div>`;
return;
}

if(screen==="settings"){
c.innerHTML=`
<div class="page">
<h2>⚙ Settings</h2>
<p>NEXO settings.</p>
<div class="card">
<h3>Account</h3>
<p>Authentication and profile settings will be connected here.</p>
</div>
</div>`;
return;
}
}

function enterKey(e){
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
}

async function sendMessage(){

  const input = document.getElementById("message");
  const messages = document.getElementById("messages");

  if (!input || !input.value.trim()) return;

  const message = input.value.trim();

  messages.innerHTML += `
    <div class="msg user">${escapeHTML(message)}</div>
  `;

  input.value = "";

  const loading = document.createElement("div");
  loading.className = "msg ai";
  loading.textContent = "NEXO is thinking...";
  messages.appendChild(loading);

  messages.scrollTop = messages.scrollHeight;

  try {

    const response = await fetch(BACKEND, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      loading.textContent =
        "Backend Error: " + (data.error || "Unknown error");
      return;
    }

    loading.textContent =
      data.reply || "NEXO received an empty response.";

    historyData.push({
      message: message,
      reply: data.reply || ""
    });

    localStorage.setItem(
      "nexo_history",
      JSON.stringify(historyData)
    );

  } catch (error) {

    loading.textContent =
      "Connection Error: " + error.message;

  }

  messages.scrollTop = messages.scrollHeight;
}
function startBuilder(){

show("chat");

setTimeout(()=>{
const input=document.getElementById("message");
input.value="I want to build a complete modern website. Help me create it step by step.";
input.focus();
},100);

}

function escapeHTML(text){
return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

show("home");

</script>

</body>
</html>
