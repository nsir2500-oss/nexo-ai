<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO — Your AI for Everything</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08080d;
  --panel:#101018;
  --panel2:#151521;
  --border:#272735;
  --text:#f5f5fa;
  --muted:#9999aa;
  --accent:#7c5cff;
  --accent2:#4e8cff;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
textarea,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#0d0d14;
  border-right:1px solid var(--border);
  padding:18px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:10;
  overflow:hidden;
}

.logo{
  font-size:25px;
  font-weight:800;
  padding:8px 12px 22px;
  letter-spacing:1px;
}

.logo span{
  color:#8065ff;
}

.new-chat{
  width:100%;
  border:1px solid #38384b;
  background:#171722;
  color:white;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.new-chat:hover{
  background:#20202d;
}

.new-chat-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;
  height:20px;
  font-size:22px;
  line-height:20px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:#b6b6c4;
  padding:11px 12px;
  border-radius:10px;
  font-size:14px;
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}

.nav button:hover{
  background:#171721;
  color:#fff;
  border-color:#252538;
}

.nav button.active{
  background:linear-gradient(135deg,rgba(124,92,255,.20),rgba(78,140,255,.10));
  border-color:rgba(124,92,255,.34);
  color:#fff;
}

.nav-icon{
  width:22px;
  height:22px;
  min-width:22px;
  flex:0 0 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9292a8;
}

.nav-icon svg{
  display:block;
  width:20px;
  height:20px;
  overflow:visible;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button:hover .nav-icon,
.nav button.active .nav-icon{
  color:#a993ff;
}

.account{
  position:absolute;
  bottom:18px;
  left:14px;
  right:14px;
  border-top:1px solid var(--border);
  padding:16px 10px 0;
  color:#9999aa;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:9px;
}

.account-dot{
  width:8px;
  height:8px;
  min-width:8px;
  border-radius:50%;
  background:#8f8fa3;
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:62px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 24px;
  background:rgba(8,8,13,.85);
  position:sticky;
  top:0;
  z-index:5;
  backdrop-filter:blur(12px);
}

.topbar-title{
  font-weight:700;
  font-size:16px;
}

.content{
  padding:30px;
  max-width:1400px;
  margin:auto;
}

/* HOME */

.hero{
  min-height:430px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(105,75,255,.22),transparent 65%);
  filter:blur(10px);
}

.hero>*{
  position:relative;
}

.hero h1{
  font-size:52px;
  line-height:1.05;
  margin-bottom:15px;
}

.gradient{
  background:linear-gradient(90deg,#9b7cff,#55a4ff,#b87cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  color:#9999aa;
  font-size:17px;
  max-width:650px;
  line-height:1.6;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.feature-card{
  border:1px solid var(--border);
  background:linear-gradient(145deg,#11111a,#0c0c12);
  border-radius:16px;
  padding:22px;
  min-height:150px;
  transition:.2s;
}

.feature-card:hover{
  border-color:#494966;
  transform:translateY(-2px);
}

.feature-card h3{
  margin-bottom:8px;
}

.feature-card p{
  color:#9999aa;
  font-size:13px;
  line-height:1.5;
}

/* CHAT */

.chat-wrap{
  max-width:900px;
  margin:auto;
}

.chat-messages{
  min-height:55vh;
  padding:20px 0;
}

.message{
  padding:15px 18px;
  border-radius:14px;
  margin-bottom:12px;
  max-width:85%;
  line-height:1.6;
  white-space:pre-wrap;
}

.message.user{
  margin-left:auto;
  background:#242039;
}

.message.ai{
  background:#14141d;
  border:1px solid var(--border);
}

.composer{
  display:flex;
  gap:10px;
  border:1px solid #333346;
  background:#111119;
  padding:10px;
  border-radius:16px;
  position:sticky;
  bottom:15px;
}

.composer textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:150px;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:10px;
}

.send-btn{
  border:0;
  background:linear-gradient(135deg,#765cff,#4f8dff);
  color:white;
  padding:0 18px;
  border-radius:11px;
}

/* BUILDER */

.builder{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.builder-head h1{
  font-size:30px;
  margin-bottom:7px;
}

.builder-head p{
  color:#9292a2;
}

.builder-input{
  border:1px solid var(--border);
  background:#101018;
  border-radius:16px;
  padding:14px;
}

.builder-input textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:transparent;
  color:white;
  border:0;
  outline:0;
  font-size:15px;
  line-height:1.6;
}

.example-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.example{
  border:1px solid #303041;
  background:#171720;
  color:#aaaabb;
  border-radius:20px;
  padding:8px 12px;
  font-size:12px;
}

.example:hover{
  color:white;
  border-color:#55556d;
}

.builder-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary{
  border:0;
  background:linear-gradient(135deg,#765cff,#4e8fff);
  color:white;
  padding:11px 17px;
  border-radius:10px;
  font-weight:600;
}

.secondary{
  border:1px solid #333346;
  background:#14141d;
  color:white;
  padding:11px 17px;
  border-radius:10px;
}

.builder-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.panel{
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  background:#0e0e15;
}

.panel-title{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  font-weight:700;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel textarea{
  width:100%;
  height:500px;
  background:#09090e;
  color:#d9d9e8;
  border:0;
  outline:0;
  resize:none;
  padding:15px;
  font-family:monospace;
  font-size:12px;
  line-height:1.5;
}

.preview-area{
  height:500px;
  background:white;
}

.preview-area iframe{
  width:100%;
  height:100%;
  border:0;
}

.preview-tools{
  display:flex;
  gap:6px;
}

.preview-tools button{
  background:#20202b;
  color:white;
  border:1px solid #363646;
  border-radius:7px;
  padding:5px 8px;
  font-size:11px;
}

.edit-box{
  border:1px solid var(--border);
  background:#101018;
  border-radius:15px;
  padding:15px;
}

.edit-box h3{
  margin-bottom:8px;
}

.edit-box textarea{
  width:100%;
  min-height:80px;
  background:#09090e;
  border:1px solid #292938;
  color:white;
  border-radius:10px;
  padding:12px;
  resize:vertical;
  outline:0;
}

/* OTHER PAGES */

.page{
  max-width:900px;
  margin:auto;
}

.page h1{
  margin-bottom:10px;
}

.page p{
  color:#9999aa;
  line-height:1.6;
}

.history-item{
  border:1px solid var(--border);
  background:#111119;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.history-item strong{
  display:block;
  margin-bottom:6px;
}

.history-item small{
  color:#777788;
}

.settings-card{
  border:1px solid var(--border);
  background:#111119;
  border-radius:14px;
  padding:20px;
  margin-top:15px;
}

.mobile-preview{
  width:390px !important;
  max-width:100%;
  margin:auto;
  display:block;
}


/* NEXO V2 ENHANCEMENTS */
.auth-overlay{position:fixed;inset:0;z-index:9999;background:rgba(4,4,8,.985);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.auth-card{width:min(430px,100%);background:#111119;border:1px solid #2c2c40;border-radius:24px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.65)}
.auth-brand{font-size:30px;font-weight:800;letter-spacing:1px;text-align:center}.auth-brand span{color:#8065ff}.auth-card h1{font-size:26px;margin:16px 0 8px;text-align:center}.auth-card p{color:#9999aa;line-height:1.5;margin-bottom:20px;text-align:center}
.auth-social{width:100%;height:48px;border:1px solid #343445;background:#181820;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:11px;font-size:15px;font-weight:600;margin-bottom:11px;transition:.18s}
.auth-social:hover{background:#20202a;border-color:#4a4a5d;transform:translateY(-1px)}
.auth-social svg{width:20px;height:20px;display:block}.auth-divider{display:flex;align-items:center;gap:12px;color:#666678;font-size:12px;margin:18px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#292936;flex:1}
.auth-input{width:100%;background:#0b0b11;border:1px solid #303044;color:#fff;border-radius:12px;padding:13px 14px;margin-bottom:11px;outline:none}.auth-input:focus{border-color:#7058ff;box-shadow:0 0 0 3px rgba(112,88,255,.10)}
.auth-primary{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#4e8cff);color:#fff;font-size:15px;font-weight:700;margin-top:2px}
.auth-actions{display:flex;gap:10px;margin-top:8px}.auth-error{color:#ff8585;font-size:13px;min-height:18px;margin:10px 0;text-align:center}.auth-note{font-size:11px!important;color:#666678!important;margin-top:17px!important;margin-bottom:0!important;text-align:center!important}
.auth-setup{margin-top:14px;padding:10px 12px;border-radius:10px;background:#19151b;border:1px solid #3b2932;color:#c5aeb5;font-size:11px;line-height:1.45;display:none}
.user-pill{display:flex;align-items:center;gap:9px}.user-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#28223e;color:#b9a9ff;font-weight:700;font-size:12px}
.history-item{cursor:pointer;transition:.2s}.history-item:hover{border-color:#5d4bc5;transform:translateY(-1px)}.history-preview{color:#c7c7d3;margin:6px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-meta{color:#777788;font-size:12px}
.history-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.danger{border:1px solid #63343a!important;color:#ff9b9b!important;background:#241316!important}.chat-history-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.app-builder-card{border:1px solid var(--border);background:#111119;border-radius:16px;padding:20px;margin-top:18px}.app-builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.app-builder-grid textarea{width:100%;height:330px;background:#0b0b11;border:1px solid var(--border);border-radius:12px;color:#eee;padding:14px;resize:vertical;outline:none}.app-preview{width:100%;height:330px;border:1px solid var(--border);border-radius:12px;background:white}
.status-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:#aaa}.status-dot{width:8px;height:8px;border-radius:50%;background:#888}.status-dot.ok{background:#4fd18b}.status-dot.bad{background:#ff6767}.small-btn{padding:7px 10px!important;font-size:12px!important}
@media(max-width:800px){.app-builder-grid{grid-template-columns:1fr}.auth-card{padding:24px}}

/* RESPONSIVE */

@media(max-width:1000px){
  .feature-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .builder-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .sidebar{
    width:72px;
    padding:12px 8px;
  }

  .logo{
    font-size:18px;
    padding:8px 5px 20px;
    text-align:center;
  }

  .new-chat{
    font-size:0;
    height:46px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    gap:0;
  }

  .new-chat-icon{
    font-size:28px;
    width:28px;
    height:28px;
  }

  .nav{
    gap:8px;
  }

  .nav button{
    justify-content:center;
    gap:0;
    font-size:0;
    text-align:center;
    padding:11px 4px;
    min-height:48px;
  }

  .nav-label{
    display:none;
  }

  .nav-icon{
    width:26px;
    height:26px;
    min-width:26px;
    flex-basis:26px;
  }

  .nav-icon svg{
    width:22px;
    height:22px;
  }

  .account{
    left:8px;
    right:8px;
    justify-content:center;
    padding:16px 0 0;
  }

  .account-label{
    display:none;
  }

  .account-dot{
    width:9px;
    height:9px;
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px);
  }

  .content{
    padding:18px;
  }

  .hero h1{
    font-size:36px;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .builder-grid{
    grid-template-columns:1fr;
  }

  .panel textarea,
  .preview-area{
    height:400px;
  }
}
</style>
</head>

<body>

<div id="authOverlay" class="auth-overlay" style="display:none"></div>

<div class="app">

  <aside class="sidebar" aria-label="NEXO navigation">

    <div class="logo">
      NEX<span>O</span>
    </div>

    <button class="new-chat" onclick="newChat()" aria-label="New Chat">
      <span class="new-chat-icon" aria-hidden="true">+</span>
      <span>New Chat</span>
    </button>

    <nav class="nav">

      <button onclick="show('home')" id="nav-home" aria-label="Home">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
        </span>
        <span class="nav-label">Home</span>
      </button>

      <button onclick="show('chat')" id="nav-chat" aria-label="Chat">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H7l-4 2 1.8-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
        </span>
        <span class="nav-label">Chat</span>
      </button>

      <button onclick="show('history')" id="nav-history" aria-label="History">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        </span>
        <span class="nav-label">History</span>
      </button>

      <button onclick="show('projects')" id="nav-projects" aria-label="Projects">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/><path d="M4 7V5h6l2 2"/></svg>
        </span>
        <span class="nav-label">Projects</span>
      </button>

      <button onclick="show('builder')" id="nav-builder" aria-label="Website Builder">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h8"/></svg>
        </span>
        <span class="nav-label">Website Builder</span>
      </button>

      <button onclick="show('appbuilder')" id="nav-appbuilder" aria-label="App Builder">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 6h4M10 18h4"/></svg>
        </span>
        <span class="nav-label">App Builder</span>
      </button>

      <button onclick="show('files')" id="nav-files" aria-label="Files">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/><path d="M4 9h16"/></svg>
        </span>
        <span class="nav-label">Files</span>
      </button>

      <button onclick="show('settings')" id="nav-settings" aria-label="Settings">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>
        </span>
        <span class="nav-label">Settings</span>
      </button>

    </nav>

    <div class="account">
      <div class="user-pill">
        <span class="user-avatar" id="accountAvatar">N</span>
        <span class="account-label" id="accountLabel">NEXO Account</span>
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-title" id="topTitle">NEXO</div>
    </header>

    <section class="content" id="content"></section>

  </main>

</div>

<script>

const BACKEND="https://ksiei-ai-backend.onrender.com/chat";
const NEXO_VERSION="2.0";

let currentUser=JSON.parse(localStorage.getItem("nexo_user")||"null");
let sessionActive=localStorage.getItem("nexo_session")==="1";
let conversations=JSON.parse(localStorage.getItem("nexo_conversations")||"[]");
let activeConversationId=null;
let currentWebsite=localStorage.getItem("nexo_website")||"";

(function migrateOldHistory(){
  const old=JSON.parse(localStorage.getItem("nexo_history")||"[]");
  if(conversations.length===0 && old.length){
    conversations=old.map((item,i)=>({
      id:"legacy-"+Date.now()+"-"+i,
      title:item.message||"NEXO conversation",
      createdAt:item.time||new Date().toLocaleString(),
      updatedAt:item.time||new Date().toLocaleString(),
      messages:[
        {role:"user",content:item.message||""},
        {role:"ai",content:item.reply||"AI response unavailable."}
      ]
    }));
    localStorage.setItem("nexo_conversations",JSON.stringify(conversations));
  }
})();

function persistConversations(){localStorage.setItem("nexo_conversations",JSON.stringify(conversations));}
function getConversation(id){return conversations.find(c=>c.id===id)||null;}
function ensureConversation(title){
  if(activeConversationId){const existing=getConversation(activeConversationId);if(existing)return existing;}
  const now=new Date().toLocaleString();
  const c={id:"chat-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),title:title||"New NEXO Chat",createdAt:now,updatedAt:now,messages:[]};
  conversations.push(c);activeConversationId=c.id;persistConversations();return c;
}

function updateAccountUI(){
  const label=document.getElementById("accountLabel"),avatar=document.getElementById("accountAvatar");
  if(label)label.textContent=currentUser?.name||"NEXO Account";
  if(avatar)avatar.textContent=(currentUser?.name||"N").trim().charAt(0).toUpperCase()||"N";
}

/* =========================
   FIREBASE AUTH / LOGIN UI
========================= */

/* Firebase web config. Project/domain are from the existing NEXO Firebase setup.
   apiKey/appId/etc. must be copied from Firebase Console > Project settings > Web app. */
const NEXO_FIREBASE_CONFIG = window.NEXO_FIREBASE_CONFIG || {

async function authError(message){
  const err=document.getElementById("authError");

async function signInWithGoogle(){
  if(!await loadFirebaseAuth()) return authError("Firebase authentication is not connected yet.");
  try{
    const {GoogleAuthProvider,signInWithPopup}=window.__NEXO_FIREBASE.authMod;
    const result=await signInWithPopup(firebaseAuth,new GoogleAuthProvider());
    finishFirebaseUser(result.user);
  }catch(e){console.error(e);authError(firebaseAuthError(e));}
}

async function signInWithApple(){
  if(!await loadFirebaseAuth()) return authError("Firebase authentication is not connected yet.");
  try{
    const {OAuthProvider,signInWithPopup}=window.__NEXO_FIREBASE.authMod;
    const provider=new OAuthProvider("apple.com");
    const result=await signInWithPopup(firebaseAuth,provider);
    finishFirebaseUser(result.user);
  }catch(e){console.error(e);authError(firebaseAuthError(e));}
}

async function submitAuth(mode){
  if(!await loadFirebaseAuth()) return authError("Firebase authentication is not connected yet. Add the Firebase Web App config first.");
  const email=(document.getElementById("authEmail")?.value||"").trim();
  const password=document.getElementById("authPassword")?.value||"";
  if(!email||!password)return authError("Email and password are required.");
  if(password.length<6)return authError("Password must be at least 6 characters.");
  try{
    const {createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile}=window.__NEXO_FIREBASE.authMod;
    let result;
    if(mode==="signup"){
      result=await createUserWithEmailAndPassword(firebaseAuth,email,password);
      const name=(document.getElementById("authName")?.value||email.split("@")[0]).trim();
      if(name)await updateProfile(result.user,{displayName:name});
    }else{
      result=await signInWithEmailAndPassword(firebaseAuth,email,password);
    }
    finishFirebaseUser(result.user);
  }catch(e){console.error(e);authError(firebaseAuthError(e));}
}

function firebaseAuthError(e){
  const c=e?.code||"";
  const map={
    "auth/invalid-credential":"Email or password is incorrect.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/email-already-in-use":"This email is already registered. Please log in.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/popup-closed-by-user":"Sign-in was cancelled.",
    "auth/popup-blocked":"Your browser blocked the sign-in popup. Please allow popups for NEXO.",
    "auth/operation-not-allowed":"This sign-in method is not enabled in Firebase Authentication.",
    "auth/unauthorized-domain":"This website domain is not authorized in Firebase Authentication."
  };
  return map[c]||e?.message||"Authentication failed.";
}

function finishFirebaseUser(user){
  if(!user)return;
  currentUser={name:user.displayName||user.email?.split("@")[0]||"NEXO User",email:user.email||"",uid:user.uid,photoURL:user.photoURL||""};
  sessionActive=true;
  localStorage.setItem("nexo_user",JSON.stringify(currentUser));
  localStorage.setItem("nexo_session","1");
  document.getElementById("authOverlay").style.display="none";
  updateAccountUI();
  show("home");
}

function logout(){
  const doLogout=async()=>{
    try{if(firebaseAuth)await window.__NEXO_FIREBASE.authMod.signOut(firebaseAuth);}catch(e){console.warn(e)}
    sessionActive=false;localStorage.removeItem("nexo_session");localStorage.removeItem("nexo_user");currentUser=null;renderAuth("login");
  };
  doLogout();
}

async function sendMessage(){
const input=document.getElementById("chatInput");const messages=document.getElementById("chatMessages");if(!input||!messages)return;
const message=input.value.trim();if(!message)return;
const conversation=ensureConversation(message.slice(0,60));
if(conversation.messages.length===0){conversation.title=message.slice(0,60);}
conversation.messages.push({role:"user",content:message});conversation.updatedAt=new Date().toLocaleString();persistConversations();
messages.innerHTML+=`<div class="message user">${escapeHTML(message)}</div>`;input.value="";
const loading=document.createElement("div");loading.className="message ai";loading.textContent="NEXO is thinking...";messages.appendChild(loading);messages.scrollTop=messages.scrollHeight;
let lastError="";
try{
  let response=null;
  for(let attempt=1;attempt<=3;attempt++){
    try{response=await fetch(BACKEND,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:message})});if(response.ok)break;lastError="HTTP "+response.status;}catch(e){lastError=e.message||"Network error";}
    if(attempt<3)await new Promise(r=>setTimeout(r,1200*attempt));
  }
  if(!response||!response.ok)throw new Error(lastError||"Backend unavailable");
  const data=await response.json();
  const reply=data.reply||data.message||data.response;
  if(!reply)throw new Error("Empty AI response");
  loading.remove();messages.innerHTML+=`<div class="message ai">${escapeHTML(reply)}</div>`;
  conversation.messages.push({role:"ai",content:reply});conversation.updatedAt=new Date().toLocaleString();persistConversations();
}catch(error){
  loading.textContent="AI response is currently unavailable. The chat backend is not responding.";
  loading.title=String(error.message||error);
  conversation.messages.push({role:"ai",content:"AI response is currently unavailable. The chat backend is not responding."});conversation.updatedAt=new Date().toLocaleString();persistConversations();
}
messages.scrollTop=messages.scrollHeight;
}

/name\s+(?:is|to|as)\s+["']([^"']+)["']/i,

/(?:called|named)\s+([A-Za-z0-9][A-Za-z0-9 &'-]{2,60})/i

];


for(const pattern of namePatterns){

const match=originalPrompt.match(pattern);

if(match){

websiteName=
match[1]
.trim()
.replace(/[.,!?]+$/,"");

break;

}

}


/* DEFAULT NAME */

if(
websiteName==="NEXO Business"
){

if(type==="restaurant")
websiteName="Royal Taste Restaurant";

else if(type==="portfolio")
websiteName="Creative Studio";

else if(type==="shopping")
websiteName="NEXO Store";

}


/* CREATE CUSTOM WEBSITE */

const website=
createWebsite(
type,
websiteName,
originalPrompt
);


currentWebsite=website;

codeArea.value=website;

refreshPreview();

localStorage.setItem(
"nexo_website",
website
);

}

/* =========================

function editWebsite(){

const codeArea=
document.getElementById("codeArea");

const editInput=
document.getElementById("editPrompt");

if(!codeArea || !editInput)return;

let code=codeArea.value;

const instruction=
editInput.value.trim().toLowerCase();

if(!code){

alert("Generate a website first.");

return;

}

if(!instruction){

alert("Tell NEXO what you want to change.");

return;

}


/* BACKGROUND */

if(
instruction.includes("black background")||
instruction.includes("dark background")
){

code=code.replace(
/body\{[\s\S]*?background:#09090f;/,
function(match){

return match.replace(
"background:#09090f",
"background:#000000"
);

}
);

}


/* WHITE BACKGROUND */

if(
instruction.includes("white background")||
instruction.includes("light background")
){

code=code.replace(
"background:#09090f",
"background:#ffffff"
);

code=code.replace(
"color:#f7f7fb",
"color:#111111"
);

}


/* RED BUTTON */

if(
instruction.includes("red button")||
instruction.includes("buttons red")
){

code=code.replace(
"linear-gradient(135deg,#765cff,#4d8cff)",
"linear-gradient(135deg,#ef4444,#b91c1c)"
);

code=code.replace(
"#765cff",
"#ef4444"
);

}


/* BLUE BUTTON */

if(
instruction.includes("blue button")||
instruction.includes("buttons blue")
){

code=code.replace(
"linear-gradient(135deg,#765cff,#4d8cff)",
"linear-gradient(135deg,#2563eb,#06b6d4)"
);

}


/* TITLE */

const titleMatch=
instruction.match(
/(?:change|rename|set).*(?:title|name).*?(?:to|as)\s+["']?([^"']+)["']?$/i
);

if(titleMatch){

const newTitle=
titleMatch[1].trim();

code=code.replace(
/<title>[\s\S]*?<\/title>/,
"<title>"+escapeHTML(newTitle)+"</title>"
);

code=code.replace(
/<div class="logo">[\s\S]*?<\/div>/,
'<div class="logo">'+escapeHTML(newTitle)+"</div>"
);

code=code.replace(
/<h1>[\s\S]*?<\/h1>/,
"<h1>"+escapeHTML(newTitle)+"</h1>"
);

}


/* ADD MENU */

if(
instruction.includes("add menu")
&&
!code.includes('id="menu"')
){

code=code.replace(
'<section id="contact">',
`

<section id="menu">

<h2>Our Menu</h2>

<div class="cards">

<div class="card">
<h3>Signature Dish</h3>
<p>Chef's special selection.</p>
</div>

<div class="card">
<h3>Popular Choice</h3>
<p>A customer favorite.</p>
</div>

<div class="card">
<h3>Today's Special</h3>
<p>Fresh and prepared specially for you.</p>
</div>

</div>

</section>

<section id="contact">`
);

}


/* ADD SERVICES */

if(
instruction.includes("add services")
&&
!code.includes('id="services"')
){

code=code.replace(
'<section id="contact">',
`

<section id="services">

<h2>Our Services</h2>

<div class="cards">

<div class="card">
<h3>Professional Service</h3>
<p>Reliable and modern solutions.</p>
</div>

<div class="card">
<h3>Creative Solutions</h3>
<p>Ideas designed around your needs.</p>
</div>

<div class="card">
<h3>Support</h3>
<p>Helpful support whenever you need it.</p>
</div>

</div>

</section>

<section id="contact">`
);

}


/* ADD ABOUT */

if(
instruction.includes("add about")
&&
!code.includes('id="about"')
){

code=code.replace(
'<section id="contact">',
`

<section id="about">

<h2>About Us</h2>

<p>
We are focused on delivering quality,
creative ideas and excellent experiences.
</p>

</section>

<section id="contact">`
);

}


/* FOOTER */

if(
instruction.includes("black footer")
){

code=code.replace(
"footer{",
"footer{background:#000000;"
);

}


/* SAVE */

currentWebsite=code;

codeArea.value=code;

localStorage.setItem(
"nexo_website",
code
);

refreshPreview();

editInput.value="";

}

async function copyWebsiteCode(){

const codeArea=
document.getElementById("codeArea");

if(!codeArea || !codeArea.value){

alert("Generate a website first.");

return;

}

try{

await navigator.clipboard.writeText(
codeArea.value
);

alert("Website code copied!");

}catch(error){

codeArea.select();

document.execCommand("copy");

alert("Website code copied!");

}

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

  show("home");
}else{

}
